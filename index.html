<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEVENTEEN Poca List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 멤버바 -->
  <div class="member-bar" id="memberBar">
    <span class="member active" data-member="ALL">ALL</span>
    <span class="member" data-member="S.COUPS">S.COUPS</span>
    <span class="member" data-member="JEONGHAN">JEONGHAN</span>
    <span class="member" data-member="JOSHUA">JOSHUA</span>
    <span class="member" data-member="WOOZI">WOOZI</span>
  </div>

  <!-- 포카 그리드 -->
  <div class="card-grid" id="cardGrid"></div>

  <!-- 파일 선택 -->
  <input type="file" id="fileInput" accept="image/*" hidden />

  <!-- 하단 버튼 -->
  <div class="floating-buttons">
    <button id="adminBtn">A</button>
    <button id="addBtn">+</button>
  </div>

  <!-- 수정/삭제 모달 -->
  <div class="modal hidden" id="editModal">
    <div class="modal-box">
      <button class="close-btn" id="closeModal">✕</button>

      <label>멤버</label>
      <input id="editMember" />

      <label>앨범 / 포카 이름</label>
      <input id="editAlbum" />

      <div class="modal-actions">
        <button id="saveBtn">수정</button>
        <button id="deleteBtn">삭제</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
